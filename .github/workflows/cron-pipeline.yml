name: News pipeline (cron)

on:
  schedule:
    # GitHub cron is always UTC.
    - cron: "26 10 * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (YYYY-MM-DD), blank = current"
        required: false
        default: ""
      no_ocr:
        description: "Skip easyocr"
        type: boolean
        default: false

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      # OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      # USE_S3: ${{ vars.USE_S3 }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      # S3_BUCKET: ${{ vars.S3_BUCKET }}
      # S3_REGION: ${{ vars.S3_REGION }}
      # S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      # S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # - name: Install ffmpeg
      #   run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install opencode CLI (used by @opencode-ai/sdk)
        run: pnpm add -g --allow-build=opencode-ai opencode-ai

      - name: Install easyocr
        if: ${{ !inputs.no_ocr }}
        run: uv sync --locked

      - name: Build scripts
        run: pnpm run build:scripts

      - name: Run pipeline
        run: |
          args=()
          if [ -n "${{ inputs.week }}" ]; then args+=("--week=${{ inputs.week }}"); fi
          if [ "${{ inputs.no_ocr }}" = "true" ]; then args+=(--no-ocr); fi
          pnpm exec tsx scripts/run_pipeline.ts "${args[@]}"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            _workspace/
            store/
          if-no-files-found: ignore
          retention-days: 14
